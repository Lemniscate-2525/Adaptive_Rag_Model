
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaptive-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: development
      ENFORCE_HTTPS: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ORIGINS: http://localhost:8501,http://127.0.0.1:8501
    restart: unless-stopped
