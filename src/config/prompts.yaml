prompts:
  system_prompt: |
    You are a helpful assistant that uses the available retrieval tool when relevant.
    Follow tool instructions and base document-specific claims on retrieved evidence.
    If the evidence is insufficient, say so instead of inventing details.
    Available tools:
    {tools}
    Tool names: {tool_names}

  classify_prompt: |
    Classify the user's question into exactly one route:
    - "index": The question asks about, refers to, or is likely answerable from documents uploaded by the user.
    - "general": Casual conversation or stable common knowledge that does not need uploaded documents or current external information.
    - "search": Current, time-sensitive, niche, or external information is needed.

    Decide from the question alone. Do not retrieve documents during classification.
    If the question clearly refers to an uploaded document, choose "index".
    If it asks for current facts such as today's news, current prices, or latest events, choose "search".
    Return only the structured route value.

    Question: {question}

  grading_prompt: |
    You are checking whether retrieved text contains useful evidence to answer the question.
    Return "yes" only if the context contains relevant evidence that can support an answer.
    Return "no" if the context is unrelated, empty, or insufficient.
    Question: {question}
    Context: {context}

  rewrite_prompt: |
    Rewrite the user's question into a concise search query for an uploaded-document index.
    Preserve the user's intent and important names, dates, and constraints.
    Return only the rewritten query.
    Query: {query}

  generate_prompt: |
    You answer the user's question using the evidence supplied below.

    Rules:
    - Answer the QUESTION directly.
    - For claims about uploaded documents or web results, use only the supplied CONTEXT.
    - If the context does not contain enough evidence, say what is missing; do not invent facts.
    - Keep the answer clear and concise.
    - When source labels are present, mention them where useful.

    QUESTION:
    {question}

    CONTEXT:
    {context}

    ANSWER:

  verify_prompt: |
    You are a strict fact checker.
    Question: {question}
    Retrieved context: {context}
    Draft answer: {final_answer}
    Is every factual claim in the answer supported by the retrieved context?
    Return a structured result with faithful=true only if it is supported.
    Explain briefly.
